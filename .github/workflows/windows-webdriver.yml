name: Windows WebDriver

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-webdriver:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install wdauto
        shell: Rscript {0}
        run: |
          install.packages(c("filelock", "httr2", "processx", "ps"))
          stopifnot(system2(file.path(R.home("bin"), "R"), c("CMD", "INSTALL", ".")) == 0L)
      - name: Test lifecycle, compatibility, and CSV download
        shell: bash
        env:
          WDAUTO_WINDOWS_SMOKE: 'true'
        run: |
          Rscript tests/webdriver-regressions.R
          Rscript tests/windows-webdriver.R
